<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laser Timelapse Sessions</title>
<style>
  :root {
    --bg: #0d0d0d; --surface: #161616; --border: #2a2a2a;
    --accent: #3d8eff; --accent-dim: #3d8eff22;
    --text: #e8e8e8; --muted: #777;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 2rem; }

  header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; }
  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  #count { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-left: auto; }

  /* status bar */
  .status-bar { display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; font-family: var(--mono); color: var(--muted); margin-bottom: 0.6rem; padding: 0.6rem 0.9rem; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); flex-wrap: wrap; }
  .status-bar.recording { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .status-bar.watching  { border-color: #2a2a2a; }
  .status-bar.idle      { border-color: #2a2a2a; color: #444; }
  .status-icon { font-size: 1rem; flex-shrink: 0; }
  .status-main { flex: 1; }

  /* progress bar */
  .progress-wrap { width: 100%; margin-top: 0.5rem; }
  .progress-track { height: 4px; background: #2a2a2a; border-radius: 2px; overflow: hidden; margin-bottom: 0.3rem; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 10s linear; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--accent); opacity: 0.8; }

  /* reference picker */
  .ref-bar { display: flex; align-items: center; gap: 0.6rem; font-size: 0.75rem; font-family: var(--mono); color: var(--muted); margin-bottom: 1.5rem; padding: 0.5rem 0.9rem; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); flex-wrap: wrap; }
  .ref-bar select { background: #1e1e1e; border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: var(--mono); font-size: 0.72rem; padding: 0.2rem 0.4rem; flex: 1; min-width: 0; }
  .ref-bar select:focus { outline: none; border-color: var(--accent); }
  .ref-bar .ref-clear { cursor: pointer; color: var(--muted); background: none; border: none; font-size: 0.75rem; padding: 0; }
  .ref-bar .ref-clear:hover { color: var(--accent); }

  /* live section */
  .live-section { margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .live-header { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1rem; cursor: pointer; user-select: none; background: var(--surface); }
  .live-header:hover { background: #1c1c1c; }
  .live-header h2 { font-size: 0.8rem; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; flex: 1; }
  .live-chevron { font-size: 0.7rem; color: var(--muted); transition: transform 0.2s; }
  .live-section.open .live-chevron { transform: rotate(180deg); }
  .live-body { display: none; padding: 1rem; background: var(--bg); }
  .live-section.open .live-body { display: block; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 1.5s ease-in-out infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .live-dot.offline { background: var(--muted); animation: none; }
  .live-frame { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; width: 100%; margin-bottom: 0.6rem; }
  .live-frame img { width: 100%; display: block; background: #111; aspect-ratio: 4/3; object-fit: cover; }
  .live-footer { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .live-updated { font-size: 0.7rem; font-family: var(--mono); color: var(--muted); flex: 1; }
  .live-interval { display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }
  .live-interval input { width: 52px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: var(--mono); font-size: 0.75rem; padding: 0.2rem 0.4rem; text-align: center; }
  .live-interval input:focus { outline: none; border-color: var(--accent); }

  /* sessions */
  .section-label { font-size: 0.8rem; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
  #sessions-status { color: var(--muted); font-size: 0.9rem; padding: 3rem 0; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.25rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color 0.15s; }
  .card:hover { border-color: var(--accent); }
  .card.is-ref { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card video { width: 100%; aspect-ratio: 4/3; display: block; background: #000; }
  .card-info { padding: 0.85rem 1rem 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .card-time { font-size: 0.88rem; font-weight: 500; }
  .card-relative { font-size: 0.75rem; color: var(--muted); }
  .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.15rem; }
  .badge { font-family: var(--mono); font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 3px; background: var(--accent-dim); color: var(--accent); }
  .badge.muted { background: #1e1e1e; color: var(--muted); }
  .badge.warn { background: #2a1a00; color: #ff9900; }
  .card-actions { padding: 0 1rem 0.85rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .btn { display: inline-block; font-size: 0.75rem; font-family: var(--mono); color: var(--text); background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 0.35rem 0.75rem; text-decoration: none; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .btn:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
  .btn.active { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
  .btn.danger { color: #ff4444; border-color: #ff444444; }
  .btn.danger:hover { background: #ff444422; border-color: #ff4444; color: #ff4444; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  /* control buttons */
  .controls { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }

  /* config panel */
  .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; margin-bottom: 0.8rem; max-width: 480px; }
  .config-grid label { font-size: 0.72rem; font-family: var(--mono); color: var(--muted); display: flex; flex-direction: column; gap: 0.15rem; }
  .config-grid input { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: var(--mono); font-size: 0.75rem; padding: 0.3rem 0.5rem; }
  .config-grid input:focus { outline: none; border-color: var(--accent); }
  .config-grid input.changed { border-color: var(--accent); }
  .config-msg { font-size: 0.72rem; font-family: var(--mono); margin-top: 0.4rem; }

  /* logs panel */
  .log-pre { margin: 0; padding: 0.75rem 1rem; font-family: var(--mono); font-size: 0.7rem; line-height: 1.55; color: #b0b0b0; background: #0a0a0a; max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .log-footer { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 1rem; background: var(--surface); border-top: 1px solid var(--border); font-size: 0.7rem; font-family: var(--mono); color: var(--muted); }
  .log-footer button { margin-left: auto; }

  /* desktop two-column layout */
  .page-layout { display: flex; gap: 1.5rem; align-items: flex-start; }
  .sidebar { width: 380px; flex-shrink: 0; position: sticky; top: 1.5rem; max-height: calc(100vh - 3rem); overflow-y: auto; scrollbar-width: none; }
  .sidebar::-webkit-scrollbar { display: none; }
  .main-content { flex: 1; min-width: 0; }

  @media (max-width: 1000px) {
    .page-layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; max-height: none; overflow: visible; }
  }
  @media (max-width: 500px) { body { padding: 1rem; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>🔥 Laser <span>Timelapse</span></h1>
  <span id="count"></span>
</header>

<div class="page-layout">
<aside class="sidebar">

<!-- Status bar -->
<div class="status-bar" id="status-bar">
  <span class="status-icon" id="status-icon">⬜</span>
  <div class="status-main">
    <span id="status-text">Loading…</span>
    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-labels">
        <span id="progress-elapsed">0m 0s elapsed</span>
        <span id="progress-eta"></span>
      </div>
      <div class="progress-eta-clock" id="progress-eta-clock" style="display:none; font-size:0.68rem; color:var(--accent); opacity:0.8; text-align:right; margin-top:0.15rem;"></div>
    </div>
  </div>
</div>

<!-- Control buttons -->
<div class="controls" id="controls">
  <button class="btn" id="btn-start" style="display:none">&#9654; Start Session</button>
  <button class="btn" id="btn-stop" style="display:none">&#9632; Stop Session</button>
  <button class="btn" id="btn-detect-enable" style="display:none">👁 Enable Watching</button>
  <button class="btn" id="btn-detect-disable" style="display:none">🚫 Disable Watching</button>
</div>

<!-- Reference session picker -->
<div class="ref-bar" id="ref-bar">
  <span>⏱ reference session:</span>
  <select id="ref-select"><option value="">— none selected —</option></select>
  <button class="ref-clear" id="ref-clear" title="Clear reference">✕</button>
</div>

<!-- Config panel -->
<div class="live-section" id="config-section">
  <div class="live-header" id="config-toggle">
    <span style="font-size:0.85rem">&#9881;</span>
    <h2>Configuration</h2>
    <span class="live-chevron">&#9650;</span>
  </div>
  <div class="live-body" id="config-body">
    <div class="config-grid" id="config-grid"></div>
    <button class="btn" id="btn-config-save" disabled>Save &amp; Reload</button>
    <div class="config-msg" id="config-msg"></div>
  </div>
</div>

<!-- Logs panel -->
<div class="live-section" id="logs-section">
  <div class="live-header" id="logs-toggle">
    <span style="font-size:0.85rem">&#128195;</span>
    <h2>Logs</h2>
    <span class="live-chevron">&#9650;</span>
  </div>
  <div class="live-body" style="padding:0">
    <pre class="log-pre" id="log-pre">Loading…</pre>
    <div class="log-footer">
      <span id="log-updated">—</span>
      <button class="btn" id="btn-log-scroll">&#8595; bottom</button>
    </div>
  </div>
</div>


</aside>
<main class="main-content">

<!-- Live camera -->
<div class="live-section" id="live-section">
  <div class="live-header" id="live-toggle">
    <span class="live-dot" id="live-dot"></span>
    <h2>Live Camera</h2>
    <span class="live-chevron">▲</span>
  </div>
  <div class="live-body">
    <div class="live-frame"><img id="live-img" src="" alt="Live snapshot" /></div>
    <div class="live-footer">
      <span class="live-updated" id="live-updated">—</span>
      <label class="live-interval" id="live-interval-wrap">
        refresh every
        <input type="number" id="live-interval" value="60" min="2" max="300" />
        s
      </label>
      <button class="btn" id="live-mode-btn" title="Toggle between snapshot and live stream">▶ live stream</button>
    </div>
  </div>
</div>

<!-- Sessions grid -->
<div class="section-label">Sessions</div>
<div id="sessions-status">Loading sessions…</div>
<div class="grid" id="grid"></div>

</main>
</div>

<script>
const SNAPSHOT_URL = 'http://192.168.0.142:8080/?action=snapshot';
const STREAM_URL   = 'http://192.168.0.142:8080/?action=stream';
const LS_REF_KEY   = 'timelapse_ref_session';

const btnStart = document.getElementById('btn-start');
const btnStop  = document.getElementById('btn-stop');
const btnDetectEnable = document.getElementById('btn-detect-enable');
const btnDetectDisable = document.getElementById('btn-detect-disable');

// ── Helpers ───────────────────────────────────────────────────────────────────

function fmtDuration(seconds) {
  if (seconds == null) return null;
  const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
  return m ? `${m}m ${s}s` : `${s}s`;
}

function fmtRelative(isoStr) {
  if (!isoStr) return '';
  const diff = (Date.now() - new Date(isoStr)) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function fmtDateTime(isoStr) {
  if (!isoStr) return '';
  return new Date(isoStr).toLocaleString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric',
    hour: 'numeric', minute: '2-digit', hour12: true,
  });
}

// ── Reference session (localStorage) ─────────────────────────────────────────

let refSession = null;  // { name, active_seconds }

function loadRef() {
  try { refSession = JSON.parse(localStorage.getItem(LS_REF_KEY)); } catch {}
}

function saveRef(name, active_seconds) {
  refSession = name ? { name, active_seconds } : null;
  if (refSession) localStorage.setItem(LS_REF_KEY, JSON.stringify(refSession));
  else localStorage.removeItem(LS_REF_KEY);
  updateRefSelect();
  updateCardHighlight();
}

function updateRefSelect() {
  const sel = document.getElementById('ref-select');
  sel.value = refSession ? refSession.name : '';
}

function updateCardHighlight() {
  document.querySelectorAll('.card[data-session]').forEach(c => {
    c.classList.toggle('is-ref', refSession && c.dataset.session === refSession.name);
  });
  document.querySelectorAll('.btn-ref').forEach(b => {
    b.classList.toggle('active', refSession && b.dataset.session === refSession.name);
    b.textContent = (refSession && b.dataset.session === refSession.name) ? '★ reference' : '☆ set reference';
  });
}

// ── Status bar + progress ─────────────────────────────────────────────────────

const statusBar    = document.getElementById('status-bar');
const statusIcon   = document.getElementById('status-icon');
const statusText   = document.getElementById('status-text');
const progressWrap = document.getElementById('progress-wrap');
const progressFill = document.getElementById('progress-fill');
const progressElapsed  = document.getElementById('progress-elapsed');
const progressEta      = document.getElementById('progress-eta');
const progressEtaClock = document.getElementById('progress-eta-clock');

let progressTimer = null;
let currentStatus = null;

function fmtWallClock(date) {
  return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function updateProgress() {
  if (!currentStatus || currentStatus.state !== 'recording' || !currentStatus.session_started) return;

  const elapsed = (Date.now() - new Date(currentStatus.session_started)) / 1000;
  const expected = currentStatus.expected_sec || (refSession && refSession.active_seconds);

  progressElapsed.textContent = `${fmtDuration(elapsed)} elapsed`;

  if (expected) {
    const pct = Math.min(100, (elapsed / expected) * 100);
    progressFill.style.width = `${pct}%`;
    const remaining = Math.max(0, expected - elapsed);
    if (remaining > 0) {
      progressEta.textContent = `~${fmtDuration(remaining)} remaining`;
      const finishAt = new Date(Date.now() + remaining * 1000);
      progressEtaClock.textContent = `done around ${fmtWallClock(finishAt)}`;
      progressEtaClock.style.display = 'block';
    } else {
      progressEta.textContent = 'should be finishing up…';
      progressEtaClock.style.display = 'none';
    }
  } else {
    progressFill.style.width = '0%';
    progressEta.textContent = 'no reference set';
    progressEtaClock.style.display = 'none';
  }
}

async function pollStatus() {
  try {
    const res = await fetch(`/sessions/status.json?_=${Date.now()}`);
    if (!res.ok) throw new Error();
    currentStatus = await res.json();
    const s = currentStatus;

    if (s.state === 'recording') {
      statusBar.className = 'status-bar recording';
      statusIcon.textContent = '🔴';
      statusText.textContent = `Recording — ${s.session || ''}`;
      progressWrap.style.display = 'block';
      updateProgress();
      if (!progressTimer) progressTimer = setInterval(updateProgress, 1000);
      btnStart.style.display = 'none';
      btnStop.style.display = '';
      btnDetectEnable.style.display = 'none';
      btnDetectDisable.style.display = 'none';
    } else {
      statusBar.className = `status-bar ${s.state === 'watching' ? 'watching' : 'idle'}`;
      statusIcon.textContent = s.state === 'watching' ? '👁' : '⬜';
      statusText.textContent = s.state === 'watching' ? 'Watching for activity' : 'Monitor offline';
      progressWrap.style.display = 'none';
      progressEtaClock.style.display = 'none';
      clearInterval(progressTimer);
      progressTimer = null;
      currentStatus = s;
      btnStart.style.display = s.state === 'watching' ? '' : 'none';
      btnStop.style.display = 'none';
      // Detection control buttons
      if (s.detection_enabled === false) {
        btnDetectEnable.style.display = '';
        btnDetectDisable.style.display = 'none';
      } else {
        btnDetectEnable.style.display = 'none';
        btnDetectDisable.style.display = '';
      }
    }
  } catch {
    statusBar.className = 'status-bar idle';
    statusIcon.textContent = '⬜';
    statusText.textContent = 'Monitor offline or unreachable';
    progressWrap.style.display = 'none';
    progressEtaClock.style.display = 'none';
    clearInterval(progressTimer);
    progressTimer = null;
    btnStart.style.display = 'none';
    btnStop.style.display = 'none';
    btnDetectEnable.style.display = 'none';
    btnDetectDisable.style.display = 'none';
  }
// Detection control button handlers
btnDetectEnable.addEventListener('click', async () => {
  btnDetectEnable.disabled = true;
  try {
    await fetch('/api/detection/enable', { method: 'POST' });
    setTimeout(pollStatus, 400); // Give backend a moment to update
  } finally {
    btnDetectEnable.disabled = false;
  }
});

btnDetectDisable.addEventListener('click', async () => {
  btnDetectDisable.disabled = true;
  try {
    await fetch('/api/detection/disable', { method: 'POST' });
    setTimeout(pollStatus, 400);
  } finally {
    btnDetectDisable.disabled = false;
  }
});
}

pollStatus();
setInterval(pollStatus, 10000);

// ── Live camera ───────────────────────────────────────────────────────────────

const liveSection     = document.getElementById('live-section');
const liveToggle      = document.getElementById('live-toggle');
const liveImg         = document.getElementById('live-img');
const liveDot         = document.getElementById('live-dot');
const liveUpdated     = document.getElementById('live-updated');
const liveInterval    = document.getElementById('live-interval');
const liveModeBtn     = document.getElementById('live-mode-btn');
const liveIntervalWrap = document.getElementById('live-interval-wrap');
let snapshotTimer     = null;
let streamMode        = false;

function refreshSnapshot() {
  const url = `${SNAPSHOT_URL}&_=${Date.now()}`;
  const probe = new Image();
  probe.onload = () => {
    liveImg.src = url;
    liveDot.classList.remove('offline');
    liveUpdated.textContent = `updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`;
  };
  probe.onerror = () => {
    liveDot.classList.add('offline');
    liveUpdated.textContent = 'camera offline';
  };
  probe.src = url;
}

function startSnapshotTimer() {
  clearInterval(snapshotTimer);
  const sec = Math.max(2, parseInt(liveInterval.value) || 30);
  snapshotTimer = setInterval(refreshSnapshot, sec * 1000);
}

function enterStreamMode() {
  streamMode = true;
  clearInterval(snapshotTimer);
  snapshotTimer = null;
  liveImg.src = STREAM_URL;
  liveDot.classList.remove('offline');
  liveUpdated.textContent = 'live stream';
  liveIntervalWrap.style.display = 'none';
  liveModeBtn.textContent = '⏸ snapshots';
  liveModeBtn.classList.add('active');
}

function enterSnapshotMode() {
  streamMode = false;
  // Stop the MJPEG stream by clearing src before reassigning
  liveImg.src = '';
  liveIntervalWrap.style.display = '';
  liveModeBtn.textContent = '▶ live stream';
  liveModeBtn.classList.remove('active');
  if (liveSection.classList.contains('open')) {
    refreshSnapshot();
    startSnapshotTimer();
  }
}

liveModeBtn.addEventListener('click', () => {
  if (streamMode) enterSnapshotMode();
  else enterStreamMode();
});

liveToggle.addEventListener('click', () => {
  const open = liveSection.classList.toggle('open');
  if (open) {
    if (streamMode) enterStreamMode();
    else { refreshSnapshot(); startSnapshotTimer(); }
  } else {
    clearInterval(snapshotTimer);
    snapshotTimer = null;
    if (streamMode) liveImg.src = '';  // stop MJPEG decode when collapsed
  }
});

liveInterval.addEventListener('change', () => {
  if (!streamMode && liveSection.classList.contains('open')) startSnapshotTimer();
});

// Start open
liveSection.classList.add('open');
refreshSnapshot();
startSnapshotTimer();

// ── Logs panel ────────────────────────────────────────────────────────────────

const logsSection  = document.getElementById('logs-section');
const logsToggle   = document.getElementById('logs-toggle');
const logPre       = document.getElementById('log-pre');
const logUpdated   = document.getElementById('log-updated');
const btnLogScroll = document.getElementById('btn-log-scroll');
let logsTimer      = null;
let logsPinBottom  = true;

async function fetchLogs() {
  try {
    const res = await fetch('/api/logs');
    const r = await res.json();
    if (!r.ok) throw new Error(r.error);
    const wasAtBottom = logPre.scrollHeight - logPre.scrollTop <= logPre.clientHeight + 4;
    logPre.textContent = r.lines.join('\n');
    logUpdated.textContent = `updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`;
    if (logsPinBottom || wasAtBottom) logPre.scrollTop = logPre.scrollHeight;
  } catch (e) {
    logPre.textContent = `Failed to fetch logs: ${e.message}`;
  }
}

logsToggle.addEventListener('click', () => {
  const open = logsSection.classList.toggle('open');
  if (open) {
    logsPinBottom = true;
    fetchLogs();
    logsTimer = setInterval(fetchLogs, 5000);
  } else {
    clearInterval(logsTimer);
    logsTimer = null;
  }
});

btnLogScroll.addEventListener('click', () => {
  logsPinBottom = true;
  logPre.scrollTop = logPre.scrollHeight;
});

logPre.addEventListener('scroll', () => {
  logsPinBottom = logPre.scrollHeight - logPre.scrollTop <= logPre.clientHeight + 4;
});

// ── Sessions grid ─────────────────────────────────────────────────────────────

const sessionMetas = {};  // name -> meta object

async function loadSessions() {
  const statusEl = document.getElementById('sessions-status');
  const grid     = document.getElementById('grid');
  const count    = document.getElementById('count');
  const refSel   = document.getElementById('ref-select');

  try {
    const res = await fetch('/sessions/', { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error(res.statusText);
    const entries = await res.json();

    const dirs = entries
      .filter(e => e.type === 'directory')
      .sort((a, b) => b.name.localeCompare(a.name));

    statusEl.style.display = 'none';

    if (!dirs.length) {
      grid.innerHTML = '<p style="color:var(--muted);padding:3rem 0;text-align:center;grid-column:1/-1">No sessions yet.</p>';
      return;
    }

    count.textContent = `${dirs.length} session${dirs.length !== 1 ? 's' : ''}`;

    for (const dir of dirs) {
      const name = dir.name.replace(/\/$/, '');

      const dirRes = await fetch(`/sessions/${name}/`, { headers: { Accept: 'application/json' } });
      if (!dirRes.ok) continue;
      const files = await dirRes.json();

      const mp4  = files.find(f => f.name.endsWith('.mp4'));
      const metaFile = files.find(f => f.name === 'meta.json');
      if (!mp4) continue;

      const videoUrl = `/sessions/${name}/${mp4.name}`;
      let started = null, activeSec = null, totalSec = null, recovered = false;

      if (metaFile) {
        try {
          const m = await (await fetch(`/sessions/${name}/meta.json`)).json();
          started   = m.started;
          activeSec = m.active_seconds;
          totalSec  = m.total_seconds;
          recovered = !!m.recovered;
          sessionMetas[name] = m;
        } catch {}
      }

      if (!started) {
        const p = name.match(/session_(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/);
        if (p) started = `${p[1]}-${p[2]}-${p[3]}T${p[4]}:${p[5]}:${p[6]}`;
      }

      // Add to reference picker if it has active duration
      if (activeSec) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = `${fmtDateTime(started)} — ${fmtDuration(activeSec)} active`;
        refSel.appendChild(opt);
      }

      const sizeMB    = mp4.size ? (mp4.size / 1048576).toFixed(1) + ' MB' : '';
      const activeDur = fmtDuration(activeSec);
      const totalDur  = fmtDuration(totalSec);
      const isRef     = refSession && refSession.name === name;

      const card = document.createElement('div');
      card.className = `card${isRef ? ' is-ref' : ''}`;
      card.dataset.session = name;
      card.innerHTML = `
        <video src="${videoUrl}" controls preload="metadata" playsinline></video>
        <div class="card-info">
          <div class="card-time">${fmtDateTime(started)}</div>
          <div class="card-relative">${fmtRelative(started)}</div>
          <div class="badges">
            ${activeDur ? `<span class="badge">⚡ ${activeDur} active</span>` : ''}
            ${totalDur  ? `<span class="badge muted">⏱ ${totalDur} total</span>` : ''}
            ${sizeMB    ? `<span class="badge muted">${sizeMB}</span>` : ''}
            ${recovered ? `<span class="badge warn">♻ recovered</span>` : ''}
          </div>
        </div>
        <div class="card-actions">
          <a class="btn" href="${videoUrl}" download="${mp4.name}">&#11015; download</a>
          ${activeSec ? `<button class="btn btn-ref${isRef ? ' active' : ''}" data-session="${name}" data-active-sec="${activeSec}">${isRef ? '★ reference' : '☆ set reference'}</button>` : ''}
          <button class="btn danger btn-delete" data-session="${name}">&#128465; delete</button>
        </div>
      `;
      grid.appendChild(card);
    }

    // Wire up ref buttons
    document.querySelectorAll('.btn-ref').forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.session;
        const sec  = parseFloat(btn.dataset.activeSec);
        if (refSession && refSession.name === name) {
          saveRef(null, null);
        } else {
          saveRef(name, sec);
        }
      });
    });

    updateRefSelect();

  } catch (e) {
    statusEl.textContent = `Error loading sessions: ${e.message}`;
    console.error(e);
  }
}

// Reference select dropdown
document.getElementById('ref-select').addEventListener('change', e => {
  const name = e.target.value;
  if (!name) { saveRef(null, null); return; }
  const meta = sessionMetas[name];
  saveRef(name, meta ? meta.active_seconds : null);
});

document.getElementById('ref-clear').addEventListener('click', () => saveRef(null, null));

loadRef();
loadSessions();

// ── Start / Stop controls ─────────────────────────────────────────────────────

async function apiPost(url) {
  const res = await fetch(url, { method: 'POST' });
  return res.json();
}

btnStart.addEventListener('click', async () => {
  btnStart.disabled = true;
  try {
    const r = await apiPost('/api/session/start');
    if (!r.ok) alert(r.error || 'Failed to start');
    else setTimeout(pollStatus, 1000);
  } catch { alert('API unreachable'); }
  finally { btnStart.disabled = false; }
});

btnStop.addEventListener('click', async () => {
  if (!confirm('Stop the current recording session?')) return;
  btnStop.disabled = true;
  try {
    const r = await apiPost('/api/session/stop');
    if (!r.ok) alert(r.error || 'Failed to stop');
    else setTimeout(pollStatus, 2000);
  } catch { alert('API unreachable'); }
  finally { btnStop.disabled = false; }
});

// ── Delete sessions (event delegation) ────────────────────────────────────────

document.getElementById('grid').addEventListener('click', async (e) => {
  const btn = e.target.closest('.btn-delete');
  if (!btn) return;
  const name = btn.dataset.session;
  if (!confirm(`Delete session ${name}?\nThis cannot be undone.`)) return;
  btn.disabled = true;
  try {
    const res = await fetch(`/api/session/${name}`, { method: 'DELETE' });
    const r = await res.json();
    if (r.ok) {
      const card = btn.closest('.card');
      card.remove();
      // Update count
      const remaining = document.querySelectorAll('.card').length;
      const countEl = document.getElementById('count');
      countEl.textContent = remaining ? `${remaining} session${remaining !== 1 ? 's' : ''}` : '';
      if (!remaining) {
        document.getElementById('grid').innerHTML = '<p style="color:var(--muted);padding:3rem 0;text-align:center;grid-column:1/-1">No sessions yet.</p>';
      }
    } else {
      alert(r.error || 'Delete failed');
      btn.disabled = false;
    }
  } catch {
    alert('API unreachable');
    btn.disabled = false;
  }
});

// ── Config panel ──────────────────────────────────────────────────────────────

const configSection = document.getElementById('config-section');
const configToggle  = document.getElementById('config-toggle');
const configGrid    = document.getElementById('config-grid');
const configSaveBtn = document.getElementById('btn-config-save');
const configMsg     = document.getElementById('config-msg');
let configOriginal  = null;
let configLoaded    = false;

const CONFIG_HIDDEN = ['output_dir'];  // not editable from UI

configToggle.addEventListener('click', () => {
  const open = configSection.classList.toggle('open');
  if (open && !configLoaded) loadConfig();
});

async function loadConfig() {
  configGrid.innerHTML = '<span style="color:var(--muted);font-size:0.75rem">Loading...</span>';
  try {
    const res = await fetch('/api/config');
    const r = await res.json();
    if (!r.ok) throw new Error(r.error);
    configOriginal = r.config;
    configLoaded = true;
    renderConfig(r.config);
  } catch (e) {
    configGrid.innerHTML = `<span style="color:#ff4444;font-size:0.75rem">Failed to load config: ${e.message}</span>`;
  }
}

function renderConfig(cfg) {
  configGrid.innerHTML = '';
  for (const [key, value] of Object.entries(cfg)) {
    if (CONFIG_HIDDEN.includes(key)) continue;
    const label = document.createElement('label');
    const input = document.createElement('input');
    const isArray = Array.isArray(value);
    input.type = typeof value === 'number' ? 'number' : 'text';
    if (typeof value === 'number') input.step = 'any';
    input.value = isArray ? JSON.stringify(value) : value;
    input.dataset.key = key;
    input.dataset.original = isArray ? JSON.stringify(value) : String(value);
    input.dataset.type = isArray ? 'array' : typeof value;
    input.addEventListener('input', onConfigInput);
    label.textContent = key;
    label.appendChild(input);
    configGrid.appendChild(label);
  }
  configSaveBtn.disabled = true;
  configMsg.textContent = '';
}

function onConfigInput() {
  let anyChanged = false;
  configGrid.querySelectorAll('input').forEach(inp => {
    const changed = inp.value !== inp.dataset.original;
    inp.classList.toggle('changed', changed);
    if (changed) anyChanged = true;
  });
  configSaveBtn.disabled = !anyChanged;
}

configSaveBtn.addEventListener('click', async () => {
  const updates = {};
  configGrid.querySelectorAll('input').forEach(inp => {
    if (inp.value === inp.dataset.original) return;
    const key = inp.dataset.key;
    let val = inp.value;
    if (inp.dataset.type === 'number') val = parseFloat(val);
    else if (inp.dataset.type === 'array') {
      try { val = JSON.parse(val); } catch { alert(`Invalid JSON for ${key}`); return; }
    }
    updates[key] = val;
  });
  if (!Object.keys(updates).length) return;

  configSaveBtn.disabled = true;
  configMsg.textContent = '';
  try {
    const res = await fetch('/api/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates),
    });
    const r = await res.json();
    if (!r.ok) {
      configMsg.style.color = '#ff4444';
      configMsg.textContent = r.error || 'Save failed';
      configSaveBtn.disabled = false;
    } else {
      configMsg.style.color = 'var(--accent)';
      configMsg.textContent = 'Saved — monitor is reloading...';
      configOriginal = r.config;
      // Re-render after a short delay to show the reloading message
      setTimeout(() => {
        renderConfig(r.config);
        configMsg.textContent = 'Saved successfully.';
        setTimeout(() => { configMsg.textContent = ''; }, 3000);
      }, 2000);
    }
  } catch {
    configMsg.style.color = '#ff4444';
    configMsg.textContent = 'API unreachable';
    configSaveBtn.disabled = false;
  }
});
</script>
